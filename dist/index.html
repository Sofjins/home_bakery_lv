<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#24190f">
  <meta name="description" content="Загляните на уютную кухню Марины. Домашние блюда, выпечка и меню для вашей семьи в Риге.">
  <title>Home Bakery — На кухне у Марины</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23342518'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-family='Georgia' font-size='44' fill='%23ebd7ac'%3Em%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
  <script src="./vendor/matter.min.js" defer></script>
  <script type="module" src="./kitchen.js"></script>
</head>
<body>
  <main id="kitchen" aria-label="Интерактивная кухня Марины">
    <div id="stage"><img id="fallback" src="./assets/original.png" alt="Уютная дубовая кухня Марины с тёплым светом, домашним кишем и книгой рецептов"><div id="canvas-host"></div><div id="hotspots"></div></div>
    <div class="vignette" aria-hidden="true"></div>
    <header>
      <a class="brand" href="./" aria-label="Home Bakery"><span class="brand-mark">m.</span><span>Home Bakery<small>MARINA · RĪGA</small></span></a>
      <nav aria-label="Главное меню"><button id="menu-button" class="nav-link" data-i18n="menu">Книга рецептов</button><a class="contact" href="https://www.instagram.com/home.baker_lv/" target="_blank" rel="noopener noreferrer" data-i18n="contact">Написать Марине <span aria-hidden="true">↗</span></a><div class="languages" aria-label="Language"><button data-lang="ru" aria-pressed="true">RU</button><span>/</span><button data-lang="lv" aria-pressed="false">LV</button></div></nav>
    </header>
    <div id="welcome"><span class="eyebrow" data-i18n="welcome">ДОБРО ПОЖАЛОВАТЬ</span><h1 data-i18n="title">На кухне у Марины</h1><p data-i18n="intro">Здесь всегда что-то вкусное.</p></div>
    <div id="loading" role="status"><span class="loading-dot"></span><span data-i18n="loading">Зажигаем свет на кухне…</span></div>
    <div id="tooltip" role="status"></div>
    <footer>
      <div class="scene-caption"><span class="small-rule"></span><span id="instruction" data-i18n="instruction">Потяните за чашку. Качните сковороду. Откройте книгу.</span></div>
      <div class="tools"><button id="hints" aria-pressed="false" data-i18n="hints">Подсказки</button><button id="sound" aria-pressed="false" data-i18n="soundOff">Звук выкл.</button><button id="motion" aria-pressed="false" data-i18n="pause">Пауза</button><button id="reset" title="Вернуть предметы на место" data-i18n="reset">Сначала</button></div>
    </footer>
    <button id="mobile-book" data-i18n="menu">Книга рецептов</button>
    <div id="live" class="sr-only" aria-live="polite"></div>
  </main>
  <dialog id="book-dialog" aria-labelledby="book-heading">
    <button id="close-book" class="close" aria-label="Закрыть">×</button>
    <div class="book-shell"><div class="book-spine" aria-hidden="true"></div><div class="book-page left-page"><div class="book-brand">Home Bakery</div><span class="eyebrow" data-i18n="fromMarina">ИЗ КУХНИ МАРИНЫ</span><h2 id="book-heading"></h2><div class="book-ornament" aria-hidden="true">✻</div><p id="book-note"></p><span id="page-left" class="page-number">01</span></div><div class="book-page right-page"><div id="recipe-content"></div><span id="page-right" class="page-number">02</span></div><div id="turn-sheet" aria-hidden="true"></div></div>
    <div class="book-controls"><button id="prev-page" aria-label="Предыдущая страница">←</button><span id="page-status"></span><button id="next-page" aria-label="Следующая страница">→</button></div>
    <a class="book-cta" href="https://www.instagram.com/home.baker_lv/" target="_blank" rel="noopener noreferrer" data-i18n="discuss">Обсудить меню с Мариной ↗</a>
  </dialog>
  <noscript><p class="noscript">Для интерактивной кухни включите JavaScript. <a href="https://www.instagram.com/home.baker_lv/">Написать Марине в Instagram</a></p></noscript>
</body>
</html>
